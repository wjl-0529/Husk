name: Build Chinese Husk IPA
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore: ['**.md']
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode with iOS 26 SDK
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Check SDK
        run: |
          xcodebuild -version
          SDK_VERSION=$(xcrun --sdk iphoneos --show-sdk-version)
          test "${SDK_VERSION%%.*}" -ge 26
      - name: Install build tools
        run: brew install meson ninja pkg-config xcodegen qemu autoconf automake libtool cmake
      - name: Install GPU code generator dependencies
        run: |
          /opt/homebrew/bin/python3 -m pip install --target "$GITHUB_WORKSPACE/build/python-deps" PyYAML Mako
          echo "PYTHONPATH=$GITHUB_WORKSPACE/build/python-deps" >> "$GITHUB_ENV"
      - name: Install Rust iOS toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios
      - name: Restore script permissions
        run: chmod +x scripts/*.sh
      - name: Restore official Android and Java resources
        run: |
          mkdir -p build
          curl -fL --retry 3 https://github.com/Leviidev/Husk/releases/download/2.0/Husk.ipa -o build/official-2.0.ipa
          python3 scripts/restore_official_resources.py
      - name: Build and package
        run: ./scripts/ci_build.sh "$GITHUB_WORKSPACE/build/Husk-zh-Hans.ipa"
      - name: Verify Chinese resources
        run: |
          unzip -p build/Husk-zh-Hans.ipa Payload/Husk.app/zh-Hans.lproj/Localizable.strings > /tmp/husk-chinese.strings
          test -s /tmp/husk-chinese.strings
      - name: Verify official resource completeness
        run: python3 scripts/verify_official_resources.py
      - name: Upload IPA and TIPA
        uses: actions/upload-artifact@v4
        with:
          name: Husk-zh-Hans
          path: |
            build/Husk-zh-Hans.ipa
            build/Husk-zh-Hans.tipa
          if-no-files-found: error
          retention-days: 14
      - name: Upload build logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            build/logs
            /tmp/husk_ipa/build.log
          if-no-files-found: ignore
